version: '3.8'

# Development Docker Compose Configuration
# Features: Hot reload, debugging, all dev tools enabled
# Usage: docker-compose -f infrastructure/dev/docker-compose.yml up

services:
  # MongoDB
  mongodb:
    image: mongo:7.0-alpine
    container_name: serenity-mongodb-dev
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: serenity
    volumes:
      - mongodb_data_dev:/data/db
    networks:
      - serenity-dev
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # API Gateway
  gateway:
    build:
      context: ../..
      dockerfile: infrastructure/dev/Dockerfile.nestjs
      args:
        SERVICE_NAME: gateway
    container_name: serenity-gateway-dev
    ports:
      - "2991:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/serenity
      - NODE_ENV=development
      - DEBUG=serenity:*
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - serenity-dev
    restart: unless-stopped
    volumes:
      - ../../../apps:/app/apps  # Mount source code for live reload

  # Auth Service
  auth-service:
    build:
      context: ../..
      dockerfile: infrastructure/dev/Dockerfile.nestjs
      args:
        SERVICE_NAME: auth-service
    container_name: serenity-auth-service-dev
    ports:
      - "2992:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/serenity
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - serenity-dev
    restart: unless-stopped
    volumes:
      - ../../../apps:/app/apps

  # API Service
  api-service:
    build:
      context: ../..
      dockerfile: infrastructure/dev/Dockerfile.nestjs
      args:
        SERVICE_NAME: api-service
    container_name: serenity-api-service-dev
    ports:
      - "2993:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/serenity
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - serenity-dev
    restart: unless-stopped
    volumes:
      - ../../../apps:/app/apps

  # Notification Service
  notification-service:
    build:
      context: ../..
      dockerfile: infrastructure/dev/Dockerfile.nestjs
      args:
        SERVICE_NAME: notification-service
    container_name: serenity-notification-service-dev
    ports:
      - "2994:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/serenity
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - serenity-dev
    restart: unless-stopped
    volumes:
      - ../../../apps:/app/apps

  # Analytics Service
  analytics-service:
    build:
      context: ../..
      dockerfile: infrastructure/dev/Dockerfile.nestjs
      args:
        SERVICE_NAME: analytics-service
    container_name: serenity-analytics-service-dev
    ports:
      - "2995:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/serenity
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - serenity-dev
    restart: unless-stopped
    volumes:
      - ../../../apps:/app/apps

  # Realtime Service
  realtime-service:
    build:
      context: ../..
      dockerfile: infrastructure/dev/Dockerfile.nestjs
      args:
        SERVICE_NAME: realtime-service
    container_name: serenity-realtime-service-dev
    ports:
      - "2996:3000"
    environment:
      - PORT=3000
      - MONGODB_URI=mongodb://mongodb:27017/serenity
      - NODE_ENV=development
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - serenity-dev
    restart: unless-stopped
    volumes:
      - ../../../apps:/app/apps

  # Web Frontend
  web:
    build:
      context: ../..
      dockerfile: infrastructure/dev/Dockerfile.nextjs
    container_name: serenity-web-dev
    ports:
      - "2997:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_URL=http://localhost:2991
    depends_on:
      - gateway
    networks:
      - serenity-dev
    restart: unless-stopped
    volumes:
      - ../../../apps:/app/apps

networks:
  serenity-dev:
    driver: bridge

volumes:
  mongodb_data_dev:
    driver: local
