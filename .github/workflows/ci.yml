name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Prisma client is needed to typecheck/build the Nest services
      - run: pnpm exec prisma generate

      # Compute base/head SHAs for `nx affected`
      - uses: nrwl/nx-set-shas@v4

      # Only lint/typecheck/test/build affected projects.
      # Python projects (ai-service, evaluation-service) use poetry targets that
      # need a Python/Poetry toolchain — excluded from this Node CI job.
      - run: pnpm nx affected -t lint typecheck test build --base=$NX_BASE --head=$NX_HEAD --exclude=ai-service,evaluation-service
