[tool.poetry]
name = "serenity-ai-service"
version = "0.1.0"
description = "Serenity AI service with FastAPI, LangGraph, Langfuse, and Postgres-backed memory hooks"
authors = ["Serenity"]
readme = "README.md"
packages = [{ include = "src" }]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.131.0"
uvicorn = { extras = ["standard"], version = "^0.40.0" }
pydantic = "^2.12.5"
pydantic-settings = "^2.12.0"
python-dotenv = "^1.2.1"
httpx = "^0.28.1"
langchain = "^1.2.3"
langchain-core = "^1.2.7"
langchain-openai = "^1.1.11"
langchain-google-genai = "^4.2.1"
langgraph = "^1.0.6"
langgraph-checkpoint-postgres = "^3.0.1"
langfuse = "^4.0.0"
psycopg = { extras = ["pool"], version = "^3.3.2" }
pypdf = "^6.4.0"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.2"
pytest-asyncio = "^1.3.0"
ruff = "^0.14.11"
mypy = "^1.19.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
